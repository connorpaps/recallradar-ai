services:
  - type: web
    name: recallradar-api
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: recallradar-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPENFDA_API_KEY
        sync: false
      - key: OPENFDA_REFRESH_MINUTES
        value: 30
      - key: ENABLE_DEMO_RECALL_SEED
        value: false
      - key: AI_PROVIDER
        value: local
      - key: ENABLE_SEMANTIC_MATCHING
        value: false
      - key: ENABLE_AI_SUMMARIES
        value: false

databases:
  - name: recallradar-db
    plan: free
