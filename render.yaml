services:
  - type: web
    name: recallradar-api
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: recallradar-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPENFDA_API_KEY
        sync: false
      - key: OPENFDA_REFRESH_MINUTES
        value: 30
      - key: MAX_UPLOAD_MB
        value: 2
      - key: MAX_CSV_ROWS
        value: 5000
      - key: MAX_UPLOAD_ERRORS
        value: 25
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: RATE_LIMIT_READ_PER_WINDOW
        value: 120
      - key: RATE_LIMIT_ACTION_PER_WINDOW
        value: 12
      - key: RATE_LIMIT_UPLOAD_PER_WINDOW
        value: 5
      - key: ENABLE_DEMO_RECALL_SEED
        value: false
      - key: AI_PROVIDER
        value: local
      - key: ENABLE_SEMANTIC_MATCHING
        value: false
      - key: ENABLE_AI_SUMMARIES
        value: false

databases:
  - name: recallradar-db
    plan: free
