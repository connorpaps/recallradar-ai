services:
  db:
    image: postgres:17-alpine
    container_name: recallradar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recallradar
      POSTGRES_PASSWORD: recallradar
      POSTGRES_DB: recallradar
    ports:
      - "5432:5432"
    volumes:
      - recallradar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallradar -d recallradar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recallradar_pgdata:

