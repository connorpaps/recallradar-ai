name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests scripts
      - name: Pytest
        run: python -m pytest -q
      - name: Matching evaluation gate
        run: python -m scripts.evaluate_matching

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8100 NEXT_PUBLIC_ENABLE_LIVE_REFRESH=false npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser workflow
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8100
      NEXT_PUBLIC_ENABLE_LIVE_REFRESH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend against local API
        working-directory: frontend
        run: NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8100 NEXT_PUBLIC_ENABLE_LIVE_REFRESH=false npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: backend
        run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8100 > ../backend.log 2>&1 &
      - name: Start frontend
        working-directory: frontend
        run: nohup npm run start -- --hostname 127.0.0.1 --port 3000 > ../frontend.log 2>&1 &
      - name: Wait for local services
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8100/health >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          cat backend.log || true
          cat frontend.log || true
          exit 1
      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e
