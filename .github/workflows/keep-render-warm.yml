name: Keep Vercel API warm

on:
  schedule:
    # A lightweight health check helps surface availability problems early.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Vercel API health endpoint
        run: >-
          curl --fail --silent --show-error --location
          --max-time 45
          https://backend-inky-rho-68.vercel.app/health
